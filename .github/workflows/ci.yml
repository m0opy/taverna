name: CI

on:
  pull_request:
    # Feature branches are validated when they target the production branch.
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Cancel stale checks for one PR, but never interrupt a production release.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: taverna_test
          POSTGRES_USER: taverna
          POSTGRES_PASSWORD: taverna
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taverna -d taverna_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://taverna:taverna@127.0.0.1:5432/taverna_test?schema=public
      TEST_DATABASE_URL: postgresql://taverna:taverna@127.0.0.1:5432/taverna_test?schema=public
      JWT_SECRET: test-secret-at-least-32-characters-long
      APP_ORIGIN: http://localhost:5173
      APP_VERSION: ${{ github.sha }}
      ENABLE_DEMO_SEED: "false"
      DEMO_PASSWORD: test-demo-password
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @taverna/api db:deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  container-smoke:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      POSTGRES_DB: taverna_ci
      POSTGRES_USER: taverna
      POSTGRES_PASSWORD: taverna
      API_IMAGE: taverna-api:ci
      WEB_IMAGE: taverna-web:ci
      APP_ORIGIN: http://localhost
      ALLOW_INSECURE_SESSION_COOKIES: "false"
      JWT_SECRET: test-secret-at-least-32-characters-long
      APP_VERSION: ci
      DEMO_PASSWORD: test-demo-password
    steps:
      - uses: actions/checkout@v4

      - name: Validate production Compose configuration
        run: docker compose -f infra/compose.prod.yml config

      - name: Build development Compose services
        run: docker compose -f infra/compose.dev.yml build

      - name: Build API production image
        run: docker build --target production --file apps/api/Dockerfile --tag "$API_IMAGE" .

      - name: Build web production image
        run: docker build --target production --file apps/web/Dockerfile --tag "$WEB_IMAGE" .
      - name: Validate Nginx configuration
        run: docker run --rm --add-host api:127.0.0.1 --entrypoint nginx "$WEB_IMAGE" -t

      - name: Start development stack
        run: docker compose -f infra/compose.dev.yml up --build -d

      - name: Check API health
        run: curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000/api/health

      - name: Tear down development stack
        if: always()
        run: docker compose -f infra/compose.dev.yml down --volumes --remove-orphans

  deploy:
    needs: [quality, container-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions: {}
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
    steps:
      - name: Deploy current main commit
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?production DEPLOY_HOST is required}"
          : "${DEPLOY_USER:?production DEPLOY_USER is required}"
          : "${DEPLOY_SSH_KNOWN_HOSTS:?production DEPLOY_SSH_KNOWN_HOSTS is required}"
          : "${DEPLOY_SSH_PRIVATE_KEY:?production DEPLOY_SSH_PRIVATE_KEY is required}"
          install --directory --mode=0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA"
